# The URL the site will be built for
base_url = "https://fewshell.com"

# The site title and description; used in feeds by default.
title = "Fewshell"
description = "Fewshell is a self-hosted AI SSH client for iOS, Android, macOS and Linux. Your SSH copilot for on-call — with secret redaction and human approval on every command."

# The theme to use
theme = "terminus"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# When set to "true", a feed is automatically generated.
generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = [
    { name = "tags", feed = true },
]

# The default author for pages
author = "Fewshot Corp"

[markdown]
# Syntax highlighting
[markdown.highlighting]
enabled = true
theme = "monokai"

# When set to "true", emoji aliases translated to their corresponding
# Unicode emoji equivalent in the rendered Markdown files.
render_emoji = true

# Whether footnotes are rendered in the GitHub-style
bottom_footnotes = true

# When set to "true", support for GitHub-style alerts
github_alerts = true

[extra]
close_responsive_menu_on_resize = true
copy_button = true
favicon_emoji = "🐚"
layout = "center"
show_default_author = false
default_social_media_image = "static/fewshell-ai-ssh-client-desktop.png"

json_ld_software_application = '''
