    "https://github.com/few-sh/fewshell"
  ]
}
'''

json_ld_faq = '''
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Can the AI run shell commands without my approval?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Every command the model proposes is staged for your review in the terminal UI and only executes after you explicitly approve it. This behavior cannot be disabled."
      }
    },
    {
      "@type": "Question",
      "name": "Which LLM providers does Fewshell support?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Fewshell is BYOM \u2014 bring your own model. It works with OpenAI, Anthropic (Claude), Google Gemini, DeepSeek, xAI, Groq, OpenRouter, and any OpenAI-compatible endpoint including self-hosted Ollama."
      }
    },
    {
      "@type": "Question",
      "name": "Is Fewshell self-hosted?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. The Fewshell agent runs on a server you control (any Linux or macOS host with SSH). Clients connect over your SSH tunnel \u2014 there is no Fewshell cloud service in the data path."
      }
    },
    {
      "@type": "Question",
      "name": "Does Fewshell send my secrets to the LLM?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Secrets are stored in your device keychain and held only in server memory. Their values \u2014 in both plaintext and base64 \u2014 are redacted from the context sent to the LLM."
      }
    },
    {
      "@type": "Question",
      "name": "What devices does Fewshell run on?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Fewshell has native clients for iOS, Android, macOS, and Linux (x86_64 and ARM64). Windows support is planned."
      }
    },
    {
      "@type": "Question",
      "name": "Is Fewshell open source?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Fewshell is licensed under AGPL-3.0. Source is available at https://github.com/few-sh/fewshell."
      }
    }
  ]
}
'''

main_menu = [
    { name = "Home", url = "", trailing_slash = true },
#    { name = "Docs", url = "docs", trailing_slash = true },
#    { name = "Blog", url = "blog", trailing_slash = true },
    { name = "Contact", url = "contact", trailing_slash = true },
]

# Leaving socials empty for now as existing site doesn't have social icons,
# just footer links which we've added to main_menu for visibility or can handle in templates
socials = []

[extra.content_security_policy]
enable = true
allowed_domains = [
    { directive = "connect-src", domains = ["'self'"] },
    { directive = "script-src", domains = ["'self'"] },
]
